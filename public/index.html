<script>
        fetch('/api/predict')
            .then(response => {
                // Cek jika server mengirim error 500
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if(data.error) throw new Error(data.error);

                document.getElementById('current').innerText = `Rp ${data.current_price}`;
                document.getElementById('prediction').innerText = `Rp ${data.predicted_next_price}`;
                
                const statusBadge = document.getElementById('status-badge');
                statusBadge.innerText = data.status;
                
                // Logika Warna Badge Status
                if(data.status.includes("Simulasi")) {
                    statusBadge.style.background = "#fff3cd"; // Kuning/Oranye
                    statusBadge.style.color = "#856404";
                } else {
                    statusBadge.style.background = "#d4edda"; // Hijau
                    statusBadge.style.color = "#155724";
                }

                const signalBox = document.getElementById('signal-box');
                signalBox.innerText = `${data.recommendation}`;
                
                if(data.recommendation.includes("BELI")) {
                    signalBox.className = "signal buy";
                } else if (data.recommendation.includes("JUAL")) {
                    signalBox.className = "signal sell";
                } else {
                    signalBox.className = "signal hold";
                }
            })
            .catch(err => {
                console.error("Fetch Error:", err);
                document.getElementById('current').innerText = "Gagal Muat";
                document.getElementById('status-badge').innerText = "Server Error / Timeout";
                document.getElementById('status-badge').style.background = "#f8d7da";
                document.getElementById('status-badge').style.color = "#721c24";
            });
    </script>
</body>
</html>
